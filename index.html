<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AuroraVision</title>
    <meta name="description"
      content="Auroravision is a collective of filmmakers based in Pōneke, Aotearoa." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@400..900&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=Bitcount+Single:wght@100..900&display=swap" />
    <link rel="canonical" href="https://www.auroravision.nz/" />

    <!--
      Social scrapers (Facebook, Slack, LinkedIn) do not run JavaScript, so
      they never see the per-page tags react-helmet-async injects. These
      static defaults are what those crawlers read; Google runs JS and gets
      the per-page ones from the Seo component.
    -->
    <meta property="og:site_name" content="AuroraVision" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AuroraVision" />
    <meta property="og:description"
      content="A collective of filmmakers based in Poneke, Aotearoa. Short films, music videos and commercial work." />
    <meta property="og:url" content="https://www.auroravision.nz/" />
    <meta property="og:image" content="https://www.auroravision.nz/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_NZ" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AuroraVision" />
    <meta name="twitter:description"
      content="A collective of filmmakers based in Poneke, Aotearoa. Short films, music videos and commercial work." />
    <meta name="twitter:image" content="https://www.auroravision.nz/og-image.jpg" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.ico" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "AuroraVision",
        "alternateName": "Auroravision",
        "url": "https://www.auroravision.nz",
        "logo": "https://www.auroravision.nz/logo512.png",
        "image": "https://www.auroravision.nz/og-image.jpg",
        "description": "A collective of filmmakers based in Te Whanganui-a-Tara, Aotearoa, making short films, music videos and commercial work.",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Wellington",
          "addressRegion": "Te Whanganui-a-Tara",
          "addressCountry": "NZ"
        },
        "sameAs": [
          "https://www.instagram.com/auroravision.nz",
          "https://www.youtube.com/@auroravision_"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
